name: asgate
description: >-
  Dart client for the asgate enduser authentication API (Client API v3).
  Handles sessions, token refresh, email/phone verification, password and
  email changes, magic links, recovery, invitations, and MFA.
version: 0.1.0
repository: https://github.com/ortegaxc/asgate

environment:
  sdk: ^3.9.0

dependencies:
  http: ^1.2.2
  meta: ^1.12.0
  rxdart: ^0.28.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.8
